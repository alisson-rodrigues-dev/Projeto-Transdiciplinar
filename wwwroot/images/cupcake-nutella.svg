  <rect x="110" y="72" width="7" height="6" rx="2" fill="#D2B48C" transform="rotate(-20 110 72)"/>
  <rect x="98" y="50" width="8" height="7" rx="2" fill="#DEB887" transform="rotate(45 98 50)"/>
  <rect x="120" y="90" width="6" height="6" rx="2" fill="#D2B48C" />
  <rect x="70" y="92" width="7" height="5" rx="2" fill="#DEB887" />
