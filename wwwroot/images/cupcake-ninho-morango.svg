<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cup3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED9C4" />
      <stop offset="100%" stop-color="#D7B89C" />
    </linearGradient>
    <linearGradient id="frosting3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#F5EFE6" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#FFF5F5"/>
  <!-- Cup base -->
  <polygon points="50,115 150,115 138,180 62,180" fill="url(#cup3)" />
  <line x1="72" y1="115" x2="80" y2="180" stroke="#B8977E" stroke-width="2" />
  <line x1="92" y1="115" x2="96" y2="180" stroke="#B8977E" stroke-width="2" />
  <line x1="110" y1="115" x2="106" y2="180" stroke="#B8977E" stroke-width="2" />
  <line x1="128" y1="115" x2="120" y2="180" stroke="#B8977E" stroke-width="2" />
  <!-- Cake Swirl Ninho -->
  <path d="M45,115 Q100,80 155,115 Q150,90 135,75 Q100,50 65,75 Q50,90 45,115 Z" fill="url(#frosting3)" stroke="#EADBC8" stroke-width="1"/>
  <!-- Top swirl Ninho -->
  <path d="M68,80 Q100,45 132,80 Q125,55 100,35 Q75,55 68,80 Z" fill="#FFF8EE" stroke="#EADBC8" stroke-width="1"/>
  <!-- Fresh Strawberry on top -->
