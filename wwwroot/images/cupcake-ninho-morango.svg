  <path d="M96,20 Q100,10 102,15 Q106,12 104,20 Z" fill="#2A9D8F"/>
  <!-- Strawberry seeds -->
  <circle cx="97" cy="28" r="1" fill="#FFE3E3"/>
  <circle cx="103" cy="28" r="1" fill="#FFE3E3"/>
  <circle cx="100" cy="35" r="1" fill="#FFE3E3"/>
  <!-- Strawberry drizzle lines -->
  <path d="M55,105 Q70,115 80,108 Q95,118 110,106 Q125,115 145,105" fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
