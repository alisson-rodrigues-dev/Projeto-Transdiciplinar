      <stop offset="0%" stop-color="#E28743" />
      <stop offset="100%" stop-color="#A85718" />
    </linearGradient>
    <linearGradient id="frosting1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5" />
      <stop offset="50%" stop-color="#DEB887" />
      <stop offset="100%" stop-color="#C68B59" />
