<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cup4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C58940" />
      <stop offset="100%" stop-color="#8B5E3C" />
    </linearGradient>
    <linearGradient id="frosting4a" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F3E7D3" />
    </linearGradient>
    <linearGradient id="frosting4b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2810" />
      <stop offset="100%" stop-color="#2D1505" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#FAF6F0"/>
  <!-- Cup base -->
  <polygon points="50,115 150,115 138,180 62,180" fill="url(#cup4)" />
  <line x1="72" y1="115" x2="80" y2="180" stroke="#5E381A" stroke-width="2" />
  <line x1="92" y1="115" x2="96" y2="180" stroke="#5E381A" stroke-width="2" />
  <line x1="110" y1="115" x2="106" y2="180" stroke="#5E381A" stroke-width="2" />
  <line x1="128" y1="115" x2="120" y2="180" stroke="#5E381A" stroke-width="2" />
  <!-- Dual Swirl: Half Ninho, Half Brigadeiro -->
  <path d="M45,115 Q100,80 155,115 Q150,90 135,75 Q100,50 65,75 Q50,90 45,115 Z" fill="url(#frosting4a)" stroke="#EADBC8" stroke-width="1"/>
  <!-- Brigadeiro half overlay -->
  <path d="M100,60 Q130,55 135,75 Q150,90 155,115 Q125,95 100,105 Z" fill="url(#frosting4b)" />
  <!-- Top dual swirl -->
  <path d="M68,80 Q100,45 132,80 Q125,55 100,35 Q75,55 68,80 Z" fill="#F8EBD9" />
  <path d="M100,35 Q125,55 132,80 Q115,70 100,75 Z" fill="#3D1D09" />
  <!-- Mini brigadeiro ball on top -->
  <circle cx="100" cy="35" r="11" fill="#2D1505" />
  <!-- Granulados belga -->
  <line x1="95" y1="32" x2="98" y2="30" stroke="#5E381A" stroke-width="2" stroke-linecap="round"/>
  <line x1="102" y1="34" x2="105" y2="33" stroke="#5E381A" stroke-width="2" stroke-linecap="round"/>
  <line x1="97" y1="38" x2="101" y2="39" stroke="#5E381A" stroke-width="2" stroke-linecap="round"/>
  <!-- Ninho milk powder dots on white side -->
  <circle cx="75" cy="85" r="1.5" fill="#C58940" />
  <circle cx="85" cy="75" r="1.5" fill="#C58940" />
  <circle cx="92" cy="88" r="1.5" fill="#C58940" />
</svg>